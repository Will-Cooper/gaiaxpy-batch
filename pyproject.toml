[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gaiaxpy-batch"
version = "2.0.0"
description = "Batch download of Gaia DR3 XP spectra through GaiaXPy, to csv, fits or txt files"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "W. J. Cooper" }]
requires-python = ">=3.11"
dependencies = [
    "gaiaxpy>=2.1.5",
    "astropy>=5.3.3",
    "astroquery",
    "numpy",
    "pandas>=1.5",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gaiaxpy-batch = "gaiaxpy_batch:main"

[project.urls]
Homepage = "https://github.com/Will-Cooper/gaiaxpy-batch"

[tool.setuptools]
py-modules = ["gaiaxpy_batch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not network'"
markers = ["network: queries the Gaia archive (deselect with -m 'not network', the default)"]
